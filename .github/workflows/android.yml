name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK and tools
        uses: android-actions/setup-android@v3
        with:
          api-level: 33
          build-tools: '33.0.2'
          components: |
            platform-tools
            platforms;android-33
            build-tools;33.0.2
            cmdline-tools;latest

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/16.0/bin/sdkmanager"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true

      - name: Ensure Gradle Wrapper is executable if present
        shell: bash
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          else
            echo "Gradle wrapper not found in repo. The build will fail unless you add gradlew and gradle/wrapper to the repository."
          fi

      - name: Build debug APK
        shell: bash
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew assembleDebug --no-daemon
          else
            echo "ERROR: Gradle wrapper not found. Add gradlew and gradle/wrapper to the repo."
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: opti-lider-debug-apk
          path: app/build/outputs/apk/debug/*.apk
